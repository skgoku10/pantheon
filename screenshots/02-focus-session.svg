<svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" width="320" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="320" height="640" rx="36" fill="#14132B"/>
  <!-- Stars -->
  <circle cx="30" cy="100" r="1" fill="#C8C3E8" opacity="0.5"/>
  <circle cx="290" cy="80" r="1.2" fill="#C8C3E8" opacity="0.6"/>
  <circle cx="250" cy="180" r="0.9" fill="#C8C3E8" opacity="0.4"/>
  <circle cx="50" cy="220" r="1" fill="#C8C3E8" opacity="0.5"/>
  <circle cx="280" cy="380" r="0.8" fill="#C8C3E8" opacity="0.4"/>
  <circle cx="20" cy="320" r="1" fill="#C8C3E8" opacity="0.5"/>
  <circle cx="300" cy="460" r="1" fill="#C8C3E8" opacity="0.4"/>
  <circle cx="60" cy="500" r="0.8" fill="#C8C3E8" opacity="0.3"/>
  <circle cx="200" cy="140" r="0.7" fill="#C8C3E8" opacity="0.4"/>
  <circle cx="80" cy="420" r="0.9" fill="#C8C3E8" opacity="0.35"/>
  <!-- Header -->
  <text x="24" y="52" font-family="Georgia, serif" font-size="13" fill="#F4EFE6" letter-spacing="2">PANTHEON</text>
  <text x="268" y="52" text-anchor="end" font-family="monospace" font-size="13" fill="#E8C547">✦ 142</text>
  <!-- Companion pill -->
  <rect x="80" y="72" width="160" height="28" rx="14" fill="#2D2B55" opacity="0.7"/>
  <circle cx="98" cy="86" r="8" fill="#E8C547" opacity="0.8"/>
  <text x="112" y="91" font-family="system-ui, sans-serif" font-size="11" fill="#C8C3E8">Pegasus is with you</text>
  <!-- Progress ring outer (track) -->
  <circle cx="160" cy="260" r="108" fill="none" stroke="#2D2B55" stroke-width="3"/>
  <!-- Progress ring filled (~70%) -->
  <circle cx="160" cy="260" r="108" fill="none" stroke="#E8C547" stroke-width="3"
    stroke-dasharray="678.6" stroke-dashoffset="203.6"
    stroke-linecap="round" transform="rotate(-90 160 260)"/>
  <!-- Constellation (Pegasus-like) -->
  <g transform="translate(65, 165)">
    <line x1="30" y1="70" x2="50" y2="52" stroke="#E8C547" stroke-width="1.4" opacity="0.85"/>
    <line x1="50" y1="52" x2="70" y2="44" stroke="#E8C547" stroke-width="1.4" opacity="0.85"/>
    <line x1="70" y1="44" x2="90" y2="56" stroke="#E8C547" stroke-width="1.4" opacity="0.85"/>
    <line x1="90" y1="56" x2="82" y2="72" stroke="#E8C547" stroke-width="1.4" opacity="0.5" stroke-dasharray="3,2"/>
    <line x1="82" y1="72" x2="60" y2="78" stroke="#C8C3E8" stroke-width="0.8" opacity="0.2"/>
    <line x1="60" y1="78" x2="38" y2="74" stroke="#C8C3E8" stroke-width="0.8" opacity="0.2"/>
    <circle cx="30" cy="70" r="2.2" fill="#E8C547"/>
    <circle cx="50" cy="52" r="2.2" fill="#E8C547"/>
    <circle cx="70" cy="44" r="2.2" fill="#E8C547"/>
    <circle cx="90" cy="56" r="2" fill="#E8C547" opacity="0.7"/>
    <circle cx="82" cy="72" r="1.4" fill="#C8C3E8" opacity="0.35"/>
    <circle cx="60" cy="78" r="1.4" fill="#C8C3E8" opacity="0.35"/>
    <circle cx="38" cy="74" r="1.4" fill="#C8C3E8" opacity="0.35"/>
    <!-- Glows -->
    <circle cx="30" cy="70" r="5" fill="#E8C547" opacity="0.12"/>
    <circle cx="50" cy="52" r="5" fill="#E8C547" opacity="0.12"/>
    <circle cx="70" cy="44" r="5" fill="#E8C547" opacity="0.12"/>
  </g>
  <!-- Timer -->
  <text x="160" y="418" text-anchor="middle" font-family="Courier New, monospace" font-size="40" fill="#F4EFE6" letter-spacing="2">17:42</text>
  <!-- Phrase -->
  <text x="160" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8B86B8">discipline is choosing what you want most</text>
  <!-- End early -->
  <text x="160" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8B86B8" text-decoration="underline">end early — keep what you've earned</text>
  <!-- Nav bar -->
  <rect x="0" y="576" width="320" height="64" rx="0" fill="#14132B" opacity="0.95"/>
  <line x1="0" y1="576" x2="320" y2="576" stroke="#2D2B55" stroke-width="1"/>
  <!-- Focus icon (active) -->
  <polygon points="80,592 83.09,598.26 90,599.27 85,604.14 86.18,611.02 80,607.77 73.82,611.02 75,604.14 70,599.27 76.91,598.26" fill="#E8C547"/>
  <text x="80" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#E8C547">Focus</text>
  <!-- Codex icon -->
  <polygon points="160,592 163.09,598.26 170,599.27 165,604.14 166.18,611.02 160,607.77 153.82,611.02 155,604.14 150,599.27 156.91,598.26" fill="none" stroke="#8B86B8" stroke-width="1.5"/>
  <text x="160" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8B86B8">Codex</text>
  <!-- Tracker icon -->
  <rect x="232" y="592" width="16" height="16" rx="2" fill="none" stroke="#8B86B8" stroke-width="1.5"/>
  <line x1="235" y1="590" x2="235" y2="594" stroke="#8B86B8" stroke-width="1.5"/>
  <line x1="244" y1="590" x2="244" y2="594" stroke="#8B86B8" stroke-width="1.5"/>
  <line x1="232" y1="598" x2="248" y2="598" stroke="#8B86B8" stroke-width="1"/>
  <text x="240" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8B86B8">Tracker</text>
</svg>
