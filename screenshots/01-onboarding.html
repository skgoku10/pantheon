<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0E0D1C; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { width: 320px; background: #1B1B3A; border-radius: 40px; padding: 40px 24px 32px; box-shadow: 0 0 80px rgba(232,197,71,0.15); border: 1px solid rgba(255,255,255,0.08); min-height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; overflow: hidden; }
  .stars { position: absolute; inset: 0; }
  .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 40px; }
  .title { font-family: Georgia, serif; font-size: 22px; color: #E8C547; margin-top: 20px; letter-spacing: 0.06em; }
  .tagline { font-family: system-ui, sans-serif; font-size: 13px; color: #8B86B8; margin-top: 8px; text-align: center; }
  .dots { display: flex; gap: 6px; margin-top: 32px; }
  .dot { width: 18px; height: 6px; border-radius: 3px; background: #E8C547; }
  .dot.off { width: 6px; background: rgba(255,255,255,0.2); }
  .btn { background: #E8C547; color: #1B1B3A; border: none; border-radius: 999px; padding: 14px 48px; font-family: system-ui, sans-serif; font-weight: 700; font-size: 15px; margin-top: 16px; }
</style>
</head>
<body>
<div class="phone">
  <svg class="stars" viewBox="0 0 320 640" preserveAspectRatio="none">
    <circle cx="40" cy="80" r="1" fill="#C8C3E8" opacity="0.4"/>
    <circle cx="280" cy="120" r="1.2" fill="#C8C3E8" opacity="0.5"/>
    <circle cx="160" cy="50" r="0.8" fill="#C8C3E8" opacity="0.3"/>
    <circle cx="60" cy="200" r="1" fill="#C8C3E8" opacity="0.4"/>
    <circle cx="290" cy="300" r="0.8" fill="#C8C3E8" opacity="0.3"/>
    <circle cx="20" cy="400" r="1" fill="#C8C3E8" opacity="0.5"/>
    <circle cx="300" cy="500" r="1.2" fill="#C8C3E8" opacity="0.4"/>
    <circle cx="100" cy="550" r="0.8" fill="#C8C3E8" opacity="0.3"/>
    <circle cx="240" cy="460" r="1" fill="#C8C3E8" opacity="0.4"/>
    <circle cx="70" cy="330" r="0.9" fill="#C8C3E8" opacity="0.35"/>
  </svg>

  <div class="logo-wrap" style="position:relative;z-index:1;">
    <svg viewBox="0 0 100 100" width="120" height="120">
      <circle cx="50" cy="50" r="6" fill="#E8C547"/>
      <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#E8C547" stroke-width="1.3" opacity="0.75" transform="rotate(-20 50 50)"/>
      <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#C8C3E8" stroke-width="1" opacity="0.55" transform="rotate(40 50 50)"/>
      <circle cx="78" cy="38" r="1.6" fill="#C8C3E8"/>
      <circle cx="22" cy="62" r="1.6" fill="#C8C3E8"/>
    </svg>
    <div class="title">PANTHEON</div>
    <div class="tagline">A focus timer for minds that wander.</div>
  </div>

  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot off"></div>
      <div class="dot off"></div>
      <div class="dot off"></div>
      <div class="dot off"></div>
      <div class="dot off"></div>
    </div>
    <button class="btn">Next →</button>
  </div>
</div>
</body>
</html>
