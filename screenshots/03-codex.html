<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0E0D1C; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { width: 320px; background: #1B1B3A; border-radius: 40px; box-shadow: 0 0 80px rgba(232,197,71,0.15); border: 1px solid rgba(255,255,255,0.08); min-height: 640px; display: flex; flex-direction: column; overflow: hidden; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 12px; background: #1B1B3A; }
  .logo { display: flex; align-items: center; gap: 6px; color: #F4EFE6; font-family: Georgia, serif; font-size: 12px; letter-spacing: 0.1em; }
  .pts { color: #E8C547; font-family: monospace; font-size: 13px; }
  .codex { flex: 1; background: #FBF8F1; padding: 16px; overflow: hidden; border-radius: 20px 20px 0 0; margin-top: 6px; }
  .banked { background: white; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid #E3DDC9; }
  .banked-label { font-family: system-ui, sans-serif; font-size: 10px; color: #9C8F73; text-transform: uppercase; letter-spacing: 0.08em; }
  .banked-pts { font-family: Georgia, serif; font-size: 18px; color: #B8860B; }
  .tier-legend { display: flex; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .tier-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tier-dot { width: 8px; height: 8px; border-radius: 50%; }
  .tier-name { font-family: system-ui, sans-serif; font-size: 9px; color: #9C8F73; }
  .tier-cost { font-family: system-ui, sans-serif; font-size: 8px; color: #B8AF94; }
  .section-label { font-family: system-ui, sans-serif; font-size: 10px; color: #9C8F73; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  .card { background: white; border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; border: 1px solid #E3DDC9; }
  .card.next { border-color: #B8860B; }
  .card-icon { width: 44px; height: 44px; background: #1B1B3A; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .card-locked { width: 44px; height: 44px; background: #E7E1F2; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .card-name { font-family: Georgia, serif; font-size: 9px; color: #1F1B33; margin-top: 4px; text-align: center; }
  .card-tier { font-family: system-ui, sans-serif; font-size: 8px; color: #9C8F73; }
  .nav { display: flex; justify-content: space-around; padding: 12px 20px; background: rgba(239,234,247,0.95); border-top: 1px solid #E3DDC9; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: system-ui, sans-serif; font-size: 10px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="16" height="16"><circle cx="50" cy="50" r="6" fill="#E8C547"/><ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#E8C547" stroke-width="1.5" opacity="0.75" transform="rotate(-20 50 50)"/><ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#C8C3E8" stroke-width="1.2" opacity="0.55" transform="rotate(40 50 50)"/></svg>
      PANTHEON
    </div>
    <div class="pts">✦ 142</div>
  </div>

  <div class="codex">
    <div class="banked">
      <div>
        <div class="banked-label">Banked points</div>
        <div class="banked-pts">142</div>
      </div>
      <div style="font-family:system-ui,sans-serif;font-size:10px;color:#9C8F73;text-align:right;max-width:130px;">spend to instantly unlock a pantheon's next figure</div>
    </div>

    <div class="tier-legend">
      <div class="tier-item"><div class="tier-dot" style="background:#C8C3E8;"></div><div class="tier-name">Common</div><div class="tier-cost">30–50</div></div>
      <div class="tier-item"><div class="tier-dot" style="background:#9CC6E8;"></div><div class="tier-name">Rare</div><div class="tier-cost">80–110</div></div>
      <div class="tier-item"><div class="tier-dot" style="background:#E8C547;"></div><div class="tier-name">Mythic</div><div class="tier-cost">160–210</div></div>
      <div class="tier-item"><div class="tier-dot" style="background:#E8836B;"></div><div class="tier-name">Legendary</div><div class="tier-cost">280</div></div>
    </div>

    <div class="section-label">Greek · 2/7</div>
    <div class="grid">
      <div class="card" style="border-color:#C8C3E8;">
        <div class="card-icon">
          <svg viewBox="0 0 100 100" width="34" height="34">
            <ellipse cx="42" cy="58" rx="16" ry="10" fill="#E8C547" transform="rotate(-15 42 58)"/>
            <circle cx="62" cy="46" r="7" fill="#E8C547"/>
            <polygon points="56,44 78,20 68,42 58,50" fill="#E8C547"/>
            <line x1="32" y1="64" x2="28" y2="80" stroke="#E8C547" stroke-width="3"/>
            <line x1="40" y1="67" x2="38" y2="84" stroke="#E8C547" stroke-width="3"/>
            <line x1="48" y1="67" x2="50" y2="84" stroke="#E8C547" stroke-width="3"/>
            <line x1="54" y1="64" x2="58" y2="80" stroke="#E8C547" stroke-width="3"/>
          </svg>
        </div>
        <div class="card-name">Pegasus</div>
        <div class="card-tier" style="color:#C8C3E8;">Common</div>
      </div>
      <div class="card" style="border-color:#C8C3E8;">
        <div class="card-icon">
          <svg viewBox="0 0 100 100" width="34" height="34">
            <circle cx="50" cy="42" r="14" fill="#E8C547"/>
            <path d="M36 36 Q28 30 22 34 M40 28 Q34 18 26 20 M50 26 Q48 14 40 12 M60 28 Q64 18 72 20 M64 36 Q72 30 78 34" stroke="#E8C547" fill="none" stroke-width="3" stroke-linecap="round"/>
            <path d="M38 54 Q50 62 62 54 L60 72 Q50 78 40 72 Z" fill="#E8C547"/>
          </svg>
        </div>
        <div class="card-name">Medusa</div>
        <div class="card-tier" style="color:#C8C3E8;">Common</div>
      </div>
      <div class="card next">
        <div class="card-icon">
          <svg viewBox="0 0 100 100" width="34" height="34">
            <circle cx="50" cy="26" r="8" fill="#E8C547" opacity="0.5"/>
            <path d="M40 32 Q50 28 60 32 L64 58 Q64 68 56 70 L44 70 Q36 68 36 58 Z" fill="#E8C547" opacity="0.35"/>
            <line x1="66" y1="40" x2="80" y2="24" stroke="#E8C547" stroke-width="4" opacity="0.5"/>
          </svg>
        </div>
        <div class="card-name">Perseus</div>
        <div class="card-tier" style="color:#9CC6E8;">Rare</div>
      </div>
      <div class="card">
        <div class="card-locked">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8B86B8" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="card-name" style="color:#B8AF94;">???</div>
        <div class="card-tier">Rare</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-item" style="color:#9C8F73;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9C8F73" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      Focus
    </div>
    <div class="nav-item" style="color:#B8860B;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#B8860B" stroke-width="2"><path d="M12 3l1.5 4.5H18l-3.75 2.75 1.5 4.5L12 12l-3.75 2.75 1.5-4.5L6 7.5h4.5z"/></svg>
      Codex
    </div>
    <div class="nav-item" style="color:#9C8F73;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9C8F73" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Tracker
    </div>
  </div>
</div>
</body>
</html>
